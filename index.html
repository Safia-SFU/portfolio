//####Think About It
#Why do we need the type="module" attribute?
It enables import and export.  index.js imports fetchJSON and renderProjects from global.js. 
It defers execution automatically. Module scripts are deferred by default, meaning the browser executes them after parsing the HTML. 
So defer is optional when type="module" is present.

//####Think About It
#Why do we include projects as classes?
The class connects the HTML to the JavaScript selector
#What happens if this container is missing or the classes don’t match?
It returns null. Then renderProjects() will fail when it tries to use that missing element.
